# Fabrique l'appli Android de Lanterval.
# - Sans clé (secrets absents) : un APK de test, installable sur un téléphone mais pas publiable.
# - Avec la clé : l'AAB pour le Play Store + l'APK signé.
# Le numéro de version proposé est celui du jeu (VERSION dans moteur/base.js) ; le versionCode suit le numéro du lancement.
name: Appli Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (vide = celui du jeu, VERSION dans moteur/base.js)"
        required: false
        default: ""

jobs:
  appli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier le jeu et fabriquer la version appli
        id: v
        run: |
          node outils/verifier.js
          node outils/appli.js app/www
          V="${{ inputs.version }}"
          [ -n "$V" ] || V=$(sed -n "s/^const VERSION = '\([^']*\)'.*/\1/p" moteur/base.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Créer le projet Android (Capacitor)
        working-directory: app
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8
          cp ../android-app/capacitor.config.json .
          npx cap add android
          npx cap sync android

      - name: Réglages Android (version, plein écran, icônes)
        working-directory: app
        run: |
          sed -i -E 's/versionCode( =)? [0-9]+/versionCode = ${{ github.run_number }}/; s/versionName( =)? "[^"]*"/versionName = "${{ steps.v.outputs.version }}"/' android/app/build.gradle
          grep -q 'versionCode = ${{ github.run_number }}' android/app/build.gradle
          # Plein écran (barres système cachées, réapparition temporaire par glissement)
          cp ../android-app/MainActivity.java android/app/src/main/java/com/keismey/lanterval/MainActivity.java
          pip install --quiet pillow
          python ../android-app/icones.py

      - name: Construire
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          V: ${{ steps.v.outputs.version }}
        run: |
          chmod +x gradlew
          mkdir -p ../../sortie
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew bundleRelease assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=upload \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            cp app/build/outputs/bundle/release/app-release.aab "../../sortie/Lanterval-$V.aab"
            cp app/build/outputs/apk/release/app-release.apk "../../sortie/Lanterval-$V.apk"
          else
            echo "::warning::Pas de clé de signature : APK de test seulement (non publiable sur le Play Store)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../sortie/Lanterval-$V-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lanterval-${{ steps.v.outputs.version }}
          path: sortie/
          retention-days: 30
